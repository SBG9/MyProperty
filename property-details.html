<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Property Details | MyProperty</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
}

.container{
  max-width:1000px;
  margin:30px auto;
  background:#fff;
  padding:24px 28px;
  border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,0.08);
}

h1{
  margin:0 0 6px;
  color:#0f172a;
}

.badge{
  display:inline-block;
  background:#22c55e;
  color:#fff;
  padding:4px 12px;
  border-radius:6px;
  font-size:13px;
  margin-bottom:14px;
}

.section{
  margin-top:26px;
}

.section h2{
  margin-bottom:10px;
  border-bottom:2px solid #22c55e;
  padding-bottom:4px;
  font-size:20px;
  color:#0f172a;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.item{
  background:#f8fafc;
  padding:10px 12px;
  border-radius:8px;
  font-size:14px;
}

.item b{
  color:#334155;
}

.media img{
  width:100%;
  max-height:320px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:10px;
}

.actions{
  margin-top:30px;
  text-align:center;
}

.actions button{
  padding:10px 18px;
  font-size:15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.back-btn{
  background:#ef4444;
  color:#fff;
}
</style>
</head>

<body>

<div class="container" id="detailsBox">
  <!-- content injected by JS -->
</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = Number(params.get("id"));

const properties = JSON.parse(localStorage.getItem("properties")) || [];
const p = properties.find(x => x.id === id);

if(!p){
  document.getElementById("detailsBox").innerHTML =
    "<h2>Property not found</h2>";
}else{
  document.getElementById("detailsBox").innerHTML = `
    <h1>${p.title || p.size + " " + p.type}</h1>
    <div class="badge">${p.listingType}</div>

    <div class="media">
      <img src="${p.images?.[0] || 'https://via.placeholder.com/800x300'}">
    </div>

    <!-- BASIC DETAILS -->
    <div class="section">
      <h2>Property Details</h2>
      <div class="grid">
        <div class="item"><b>Type:</b> ${p.type}</div>
        <div class="item"><b>Condition:</b> ${p.condition}</div>
        <div class="item"><b>Size:</b> ${p.size}</div>
        <div class="item"><b>Price:</b> ₹ ${p.price}</div>
      </div>
    </div>

    <!-- LOCATION -->
    <div class="section">
      <h2>Location Details</h2>
      <div class="grid">
        <div class="item"><b>State:</b> ${p.location.state}</div>
        <div class="item"><b>District:</b> ${p.location.district}</div>
        <div class="item"><b>Taluka:</b> ${p.location.taluka || "-"}</div>
        <div class="item"><b>City:</b> ${p.location.city || "-"}</div>
        <div class="item"><b>Village:</b> ${p.location.village || "-"}</div>
        <div class="item"><b>Pincode:</b> ${p.location.pincode || "-"}</div>
        <div class="item"><b>Landmark:</b> ${p.location.landmark || "-"}</div>
        <div class="item"><b>Survey No:</b> ${p.location.surveyNo || "-"}</div>
      </div>
      <div class="item" style="margin-top:10px">
        <b>Location Note:</b><br>
        ${p.location.note || "—"}
      </div>
    </div>

    <!-- FACILITIES -->
    <div class="section">
      <h2>Facilities</h2>
      <div class="grid">
        <div class="item"><b>Parking:</b> ${p.facilities.parking}</div>
        <div class="item"><b>Furnishing:</b> ${p.facilities.furnish}</div>
        <div class="item"><b>Water:</b> ${p.facilities.water}</div>
        <div class="item"><b>Electricity:</b> ${p.facilities.electricity}</div>
      </div>
      <div class="item" style="margin-top:10px">
        <b>Other Facilities:</b><br>
        ${p.facilities.note || "—"}
      </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="section">
      <h2>Description</h2>
      <div class="item">
        ${p.description || "No description provided"}
      </div>
    </div>

    <!-- CONTACT -->
    <div class="section">
      <h2>Contact Details</h2>
      <div class="grid">
        <div class="item"><b>Name:</b> ${p.contactName}</div>
        <div class="item"><b>Phone:</b> ${p.contactPhone}</div>
        <div class="item"><b>Email:</b> ${p.ownerEmail}</div>
      </div>
    </div>

    <div class="actions">
      <button class="back-btn" onclick="history.back()">❌ Cancel & Go Back</button>
    </div>
  `;
}
</script>

</body>
</html>
