<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register Property | MyProperty</title>

<style>

/* ===== BODY & GLOBAL ===== */
body {
  margin: 0;
  font-family: 'Arial', Helvetica, sans-serif;
  background: #f5f7fb;
  color: #111;
}

h1, h2 {
  font-weight: 600;
  color: #0f172a;
  margin: 0;
}

/* ===== NAVBAR ===== */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 40px;
  background: #0f172a;
  color: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.navbar a {
  color: #00ffd9;
  text-decoration: none;
  margin-left: 18px;
  font-weight: 600;
  transition: color 0.2s;
}

.navbar a:hover {
  color: #22c55e;
}

/* ===== FORM BOX ===== */
.form-box {
  max-width: 920px;
  margin: 40px auto;
  background: #fff;
  padding: 30px 36px;
  border-radius: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

.form-box h1 {
  margin-bottom: 24px;
  font-size: 28px;
}

.form-box h2 {
  margin: 28px 0 16px;
  border-bottom: 2px solid #22c55e;
  padding-bottom: 6px;
  font-size: 20px;
}

/* ===== FORM GROUPS ===== */
.form-group, .location-group, .facilities-group {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-bottom: 18px;
}

.location-group, .facilities-group {
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

/* ===== INPUT, SELECT, TEXTAREA ===== */
input, select, textarea {
  padding: 10px 12px;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid #ccc;
  width: 100%;
  box-sizing: border-box;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus, select:focus, textarea:focus {
  border-color: #22c55e;
  box-shadow: 0 0 4px rgba(34, 197, 94, 0.3);
  outline: none;
}

/* ===== TEXTAREA SPANS ===== */
textarea {
  grid-column: span 2;
  resize: vertical;
  line-height: 1.5;
}

/* ===== SPAN CLASSES ===== */
.span-1 { grid-column: span 1; }
.span-2 { grid-column: span 2; }
.span-4 { grid-column: span 4; }

/* ===== FACILITIES NOTE ===== */
.facility-note {
  grid-column: span 2;
  min-height: 56px;
}

/* ===== BUTTON ===== */
.submit-btn {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  font-weight: 600;
  color: #fff;
  background: #22c55e;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s, opacity 0.2s;
  margin-top: 20px;
}

.submit-btn:hover {
  opacity: 0.9;
  background: #1eaa4f;
}

/* ===== MEDIA PREVIEW ===== */
.preview img,
.preview video,
.preview audio {
  width: 100%;
  margin-top: 8px;
  border-radius: 8px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .form-group, .location-group, .facilities-group {
    grid-template-columns: 1fr;
  }

  textarea, .facility-note {
    grid-column: span 1;
  }
}


</style>


<script>
// ================= LOGIN CHECK =================

const isLoggedIn = localStorage.getItem("isLoggedIn") === "yes";
let user = JSON.parse(localStorage.getItem("loggedInUser"));
let users = JSON.parse(localStorage.getItem("users")) || [];

if(!isLoggedIn || !user){
  // window.location.replace("login.html");// 10 jan
  window.location.replace("auth.html");

}

// ensure properties array exists
user.properties = user.properties || [];

</script>

</head>

  <nav>
    <a href="dashboard.html">Dashboard</a>

<div class="form-box">
<h1>Register Your Property</h1>

<form onsubmit="saveProperty(event)">

<!-- BASIC DETAILS -->
<h2>Property Details</h2>
<div class="form-group">

  <input
  id="title"
  placeholder="Property Title (e.g. 2 BHK Flat in Pune)"
  required
 > <!-- 12 jan title added -->

  <select id="listingType" required>   <!--9j modify  -->
  <option value="">Listing Type</option>
  <option value="Buy">For Sale</option>
  <option value="Rent">For Rent</option>
  <option value="Lease">For Lease</option>
  </select>


  <select id="type" required>
    <option value="">Property Type</option>
    <option>Home</option>

    <option>Plot</option>
    <option>Bungalow</option>
    <option>Commercial</option>
    <option>Shop</option>

  </select>

  <select id="condition">
    <option>New</option>

<div class="form-group">
  <textarea
    id="locationNote"

    placeholder="Exact location details (House name, road, plot description, directions etc.)"

</div>


<!-- FACILITIES -->
<!-- 12 jan newlly added faclities code -->
<h2>Facilities</h2>

<div class="facilities-group">

  <select id="parking">
    <option value="">Parking</option>
    <option value="Available">Available</option>

  </select>

  <select id="furnish">

  <select id="water">
    <option value="">Water</option>
    <option value="24x7">24x7</option>
    <option value="Limited">Limited</option>
  </select>

  <select id="electricity">
    <option value="">Electricity</option>
    <option value="Available">Available</option>
    <option value="No">No</option>
  </select>

</div>

<div class="form-group">
  <textarea
    id="facilityNote"
    class="facility-note"
    placeholder="Other facilities (lift, security, borewell, garden, road access, irrigation etc.)"

</div>

<h2>Contact Details</h2>
<div class="form-group">
  <input id="contactName" placeholder="Contact Person Name" type="text">

<script>
function fileToBase64(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

async function saveProperty(e){

  const imagesInput = document.getElementById("images");  // 9j  2 lines for img and aud add
  const videoInput  = document.getElementById("video");

  e.preventDefault();


  let imagesArr = [];
for(let f of imagesInput.files){
  imagesArr.push(await fileToBase64(f));
}

let vid = videoInput.files.length > 0
  ? await fileToBase64(videoInput.files[0])
  : "";


  // let imagesArr = [];   // 9 jan replacement for up side .
  // for(let f of images.files){
  //   imagesArr.push(await fileToBase64(f));
  // }

  // let vid = video.files[0] ? await fileToBase64(video.files[0]) : "";
  // let aud = audio.files[0] ? await fileToBase64(audio.files[0]) : "";   // 9j for remove audio option

  let property = {
    id: Date.now(),
    ownerId: user.id,
    ownerEmail: user.email,
    ownerName: user.name,

    title: title.value, //19 jan modify


    listingType: listingType.value,   // 9j modify


    type: type.value,
    condition: condition.value,
    size: size.value,
    price: Number(price.value),

    // location: { // comented 12 jan
    //   country: country.value,
    //   state: state.value,
    //   district: district.value,
    //   city: city.value,
    //   pincode: pincode.value,
    //   landmark: landmark.value
    // },

    location:{    // newlly added code 12 jan
  state: state.value,
  district: district.value,
  taluka: taluka.value,
  city: city.value,
  village: village.value,
  pincode: pincode.value,
  landmark: landmark.value,
  surveyNo: surveyNo.value,
  note: locationNote.value
},


    // facilities:{
    //   parking: parking.value,
    //   furnish: furnish.value,
    //   water: water.value,
    //   electricity: electricity.value
    // },

    facilities:{
  parking: parking.value,
  furnish: furnish.value,
  water: water.value,
  electricity: electricity.value,
  note: facilityNote.value
},


    images: imagesArr,
    video: vid,
    // audio: aud,   // 9j for remove aud option

    description: desc.value,
    contactName: contactName.value,
    contactPhone: contactPhone.value,

    status: "Available",
    createdAt: new Date().toISOString()
  };

  // ================= SAVE TO GLOBAL PROPERTIES =================
  let properties = JSON.parse(localStorage.getItem("properties")) || [];
  properties.unshift(property);
  localStorage.setItem("properties", JSON.stringify(properties));

  // ================= SAVE TO USER =================
  user.properties.push(property.id);
  user.totalProperties = user.properties.length;

  user.activity = user.activity || [];
  user.activity.unshift("Added property: " + property.type);

  localStorage.setItem("loggedInUser", JSON.stringify(user));

  let index = users.findIndex(u => u.id === user.id);
  if(index !== -1){
    users[index] = user;
    localStorage.setItem("users", JSON.stringify(users));
  }

  alert("Property Registered Successfully!");
  location.href = "my-properties.html";
}
</script>

<script>
function logout(){
  localStorage.removeItem("loggedInUser");
  localStorage.removeItem("isLoggedIn");
  window.location.replace("auth.html");   //10 jan
}
</script>
