<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buy Property | MyProperty</title>
<link rel="stylesheet" href="css/style.css">

<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;margin:0}
.navbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:15px 20px;background:#0f172a;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.navbar nav a{margin-left:18px;text-decoration:none;color:#00ffd9;font-weight:600;}
.navbar .btn{background:#0f172a;color:#00ffd9;padding:8px 14px;border-radius:6px;text-decoration:none;}
.filter-box{max-width:1100px;margin:20px auto;padding:15px;border-radius:12px;background:#f8fafc;box-shadow:0 0 10px rgba(0,0,0,0.08);}
.filter-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.filter-row input,.filter-row select{padding:8px;}
.filter-btn{margin-top:12px;width:100%;padding:10px;background:#22c55e;border:none;color:white;font-size:16px;cursor:pointer;}

.buy-feed{
  max-width:1200px;
  margin:30px auto;
}


.property-card{
  display:flex;
  gap:15px;
  padding:15px;
  border-radius:12px;
  background:#fff;
  border:1px solid #ddd;
  margin-bottom:20px;
}

.property-card img{
  width:260px;
  height:180px;
  object-fit:cover;
  border-radius:10px;
}

.card-content{
  flex:1;
  position:relative;
  display:flex;
  flex-direction:column;
}


.status-badge{
  position:absolute;
  top:0;
  right:0;
  background:#22c55e;
  color:#fff;
  padding:4px 10px;
  font-size:12px;
  border-radius:6px;
}

.card-actions button{
  margin-right:8px;
  padding:6px 12px;
  cursor:pointer;
}

.card-actions{
  margin-top:auto;
}


.card-content h3{
  margin:0 0 6px;
}

.card-content p{
  margin:4px 0;
  color:#334155;
}
.property-card img{
  flex-shrink:0;
}
.status-badge{
  top:6px;
  right:6px;
}


</style>
</head>

<body>

<header class="navbar">
  <div class="logo">MyProperty</div>
  <nav id="mainNav"></nav>
</header>

<!-- FILTER FORM -->
<div class="filter-box">
  <h3>Find Property</h3>
  <div class="filter-row">
    <select>
      <option>Property Type</option>
      <option>Home</option>
      <option>Flat</option>
      <option>Plot</option>
      <option>Agricultural Land</option>
      <option>Shop</option>
      <option>Office</option>
      <option>Commercial Space</option>
    </select>

    <input type="text" placeholder="Keyword (optional)">
    <input type="number" placeholder="Min Price">
    <input type="number" placeholder="Max Price">

    <input type="text" placeholder="City / Locality">
    <select>
      <option>Purpose</option>
      <option>Residential</option>
      <option>Commercial</option>
      <option>Agricultural</option>
      <option>Industrial</option>
    </select>

    <select>
      <option>Condition</option>
      <option>Ready to Move</option>
      <option>Under Construction</option>
    </select>

    <select>
      <option>Ownership</option>
      <option>Resale</option>
      <option>New Construction</option>
      <option>Builder Project</option>
    </select>
  </div>

  <button class="filter-btn">Search</button>
</div>

<!-- PROPERTY LIST -->

<div class="buy-feed" id="propertyFeed"></div>

<script>
// ================= GLOBAL =================
const feed = document.getElementById("propertyFeed");
const nav  = document.getElementById("mainNav");

const isLoggedIn = localStorage.getItem("isLoggedIn") === "yes";
const user = JSON.parse(localStorage.getItem("loggedInUser"));
let properties = JSON.parse(localStorage.getItem("properties")) || [];

// ================= NAVBAR =================
if(isLoggedIn){
  nav.innerHTML = `
    <a href="index.html">Home</a>
    <a href="buy.html">Buy</a>
    <a href="rent.html">Rent</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="#" onclick="logout()">Logout</a>
  `;
}else{
  nav.innerHTML = `
    <a href="index.html">Home</a>
    <a href="buy.html">Buy</a>
    <a href="rent.html">Rent</a>
    <a href="auth.html">Login</a>
  `;
}
//    <a href="auth.html">Login</a> // 10 jan login to auth 

// ================= LOAD BUY PROPERTIES =================
// const buyProps = properties.filter(p =>         // 9j modify
//   p.status === "Available" && p.purpose === "Buy"
// );

const buyProps = properties.filter(p =>
  p.status === "Available" && p.listingType === "Buy"
);


if(buyProps.length === 0){
  feed.innerHTML = `
    <p style="text-align:center">
      No properties available for buying.<br><br>
      <a href="userrequirement.html" class="btn">Post Your Requirement</a>
    </p>
  `;
}else{
  renderBuyProperties(buyProps);
}

// ================= RENDER =================
function renderBuyProperties(list){
  feed.innerHTML = "";

  list.forEach(p => {
    const card = document.createElement("div");
    card.className = "property-card";

    card.innerHTML = `
      <img src="${p.images?.[0] || ''}"
           onerror="this.src='https://via.placeholder.com/260x180'">

      <div class="card-content">
        <div class="status-badge">${p.status}</div>

        <h3>${p.title || p.size + " " + p.type}</h3>
        <p><b>For:</b> ${p.listingType}</p>
        <p><b>Location:</b> ${p.location.city}, ${p.location.district || ""}</p>
        <p><b>Size:</b> ${p.size || "-"}</p>
        <p class="price"><b>Price:</b> ₹ ${p.price}</p>

        <div class="card-actions">
          ${
            isLoggedIn
            ? `<button onclick="saveProperty(${p.id})">❤️ Save</button>`
            : ``
          }
          <button onclick="contactSeller('${p.contactPhone || ""}')">
            📞 Contact
          </button>
          <button onclick="viewDetails(${p.id})">🔍 View Details</button>
          <button onclick="shareProperty(${p.id})">🔗 Share</button>
        </div>
      </div>
    `;
    feed.appendChild(card);
  });
}


// ================= ACTIONS =================

function contactSeller(phone){
  if(!isLoggedIn){
    alert("Please login to contact seller");
    location.href = "auth.html";   // 10 jan
    return;
  }
  alert("Seller Contact: " + phone);
}

function saveProperty(id){
  if(!isLoggedIn){
    alert("Please login to save property");
    location.href = "auth.html"; //10 jan
    return;
  }

  user.savedProperties = user.savedProperties || [];

  if(!user.savedProperties.includes(id)){
    user.savedProperties.push(id);
    localStorage.setItem("loggedInUser", JSON.stringify(user));

    // Update global users array
    let users = JSON.parse(localStorage.getItem("users")) || [];
    const index = users.findIndex(u => u.id === user.id);
    if(index !== -1){
      users[index] = user;
      localStorage.setItem("users", JSON.stringify(users));
    }

    alert("💾 Property saved to your list!");
  } else {
    alert("💾 Property already saved!");
  }
}


// function viewDetails(id){  // 19 jan
//   localStorage.setItem("selectedPropertyId", id);
//   location.href = "property-details.html";
// }
function viewDetails(id){ //19 jan 
  location.href = "property-details.html?id=" + id;
}


function shareProperty(id){
  alert("Share link copied (demo)");
}


function logout(){
  localStorage.removeItem("loggedInUser");
  localStorage.removeItem("isLoggedIn");
  window.location.replace("auth.html");//10 jan 
}

</script>

</body>
</html>
